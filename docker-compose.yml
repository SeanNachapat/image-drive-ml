version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: image-drive-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-drive-ml-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=image_embeddings
      - MODEL_NAME=openai/clip-vit-base-patch32
      - UPLOAD_DIR=data/uploads
    volumes:
      - api_data:/app/data
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_storage:
  api_data:
